<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speisely Magazin — Ausgabe 01 Cover</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121815;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* A4 Magazine Dimensions (210mm x 297mm in pixels at 96 DPI: 794px x 1123px) */
    .magazine-cover {
      width: 794px;
      height: 1123px;
      position: relative;
      background-color: #FBF7EE;
      overflow: hidden;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.8);
      border-radius: 4px;
    }

    /* Geometric Brand Angular Background Fields */
    .bg-forest-poly {
      position: absolute;
      top: 0;
      left: 0;
      width: 44%;
      height: 60%;
      background-color: #173C32;
      clip-path: polygon(0 0, 100% 0, 0 100%);
      z-index: 1;
    }

    .bg-mint-poly {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 70%;
      height: 55%;
      background-color: #DDEEE3;
      clip-path: polygon(0 40%, 100% 0, 75% 100%, 0 100%);
      z-index: 1;
    }

    .bg-gold-poly {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 48%;
      height: 48%;
      background-color: #c99335;
      clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%);
      z-index: 1;
    }

    /* Massive Kinetic Watermark 2026 */
    .watermark-year {
      position: absolute;
      top: 24%;
      left: 2%;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 210px;
      line-height: 0.85;
      color: #dfceb1;
      opacity: 0.55;
      z-index: 2;
      pointer-events: none;
      letter-spacing: -10px;
    }

    /* Central Schnitzel Cutout Container */
    .schnitzel-cutout-container {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translateX(-50%);
      width: 680px;
      height: 500px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .schnitzel-cutout {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 25px 35px rgba(18, 38, 28, 0.45));
    }

    /* Foreground Typography Elements */
    .hero-headline {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .hero-headline h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      font-size: 78px;
      line-height: 0.88;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: -2px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="magazine-cover">
    
    <!-- Geometric Background Poly Fields -->
    <div class="bg-forest-poly"></div>
    <div class="bg-mint-poly"></div>
    <div class="bg-gold-poly"></div>

    <!-- Massive Background Watermark Year (2026) -->
    <div class="watermark-year">
      20<br>26
    </div>

    <!-- =========================================================================
         TOP HEADER ROW
         ========================================================================= -->
    <div class="relative z-20 flex justify-between items-start px-8 pt-8 w-full">
      
      <!-- Top Left Issue Number (In White on Green Triangle) -->
      <div class="text-white space-y-0.5">
        <p class="text-[12px] font-extrabold uppercase tracking-widest leading-none">16. AUSGABE</p>
        <p class="font-mono text-4xl font-black leading-none">01</p>
      </div>

      <!-- Top Center Official Speisely Logo (With official emblem + wordmark) -->
      <div class="flex flex-col items-center justify-center pt-1">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-[#173C32] flex items-center justify-center p-1.5 shadow-md">
            <img src="speisely_logo.png" alt="Speisely Emblem" class="w-full h-full object-contain filter invert brightness-200">
          </div>
          <div>
            <h2 class="font-serif text-3xl font-black tracking-wider text-[#173C32] leading-none">
              SPEISELY
            </h2>
            <p class="text-[9px] font-extrabold tracking-[0.25em] text-[#173C32] uppercase text-center mt-0.5">
              MAGAZIN
            </p>
          </div>
        </div>
      </div>

      <!-- Top Right Date Stamp (Corrected August 01 2026) -->
      <div class="text-right text-[#173C32] space-y-0.5">
        <p class="text-[12px] font-extrabold uppercase tracking-widest leading-none">AUGUST</p>
        <p class="font-mono text-4xl font-black leading-none">01</p>
        <p class="text-[11px] font-extrabold tracking-wider leading-none">2026</p>
      </div>

    </div>

    <!-- =========================================================================
         RIGHT SIDEBAR FEATURE CALLOUTS
         ========================================================================= -->
    <div class="absolute right-8 top-56 z-20 text-right max-w-[200px] space-y-3">
      <div class="space-y-0.5">
        <p class="font-black text-2xl text-[#173C32] leading-tight tracking-tight uppercase">
          SPEISELY<br>PARTNER-<br>STORY
        </p>
      </div>
      <div class="inline-block px-3 py-1 bg-[#173C32] text-[#E6B84A] rounded text-[10px] font-black uppercase tracking-wider">
        SEIT 2013 EIN TEIL DES FESTES
      </div>
    </div>

    <!-- =========================================================================
         CENTRAL SCHNITZEL SHOWCASE
         ========================================================================= -->
    <div class="schnitzel-cutout-container">
      <img 
        src="https://images.unsplash.com/photo-1599921841143-819065a55cc6?auto=format&fit=crop&w=1200&q=90" 
        alt="Goldbraunes Schnitzel" 
        class="schnitzel-cutout rounded-3xl object-cover"
        style="clip-path: polygon(8% 12%, 92% 8%, 98% 85%, 88% 95%, 15% 98%, 4% 80%);"
      >
    </div>

    <!-- Bold Centered Headline overlaid across image -->
    <div class="hero-headline">
      <h1>
        SCHNITZEL<br>SCHMIEDE
      </h1>
    </div>

    <!-- =========================================================================
         BOTTOM FOOTER ROW
         ========================================================================= -->
    <div class="absolute bottom-8 inset-x-8 z-20 flex justify-between items-end">
      
      <!-- Bottom Left Editorial Teaser -->
      <div class="max-w-md">
        <p class="text-sm font-bold text-[#173C32] leading-snug">
          Eine Geschichte über Handwerk, Beständigkeit und die kulinarische Meile in Mönchengladbach.
        </p>
      </div>

      <!-- Bottom Right Destination URL in Gold Field -->
      <div class="text-right">
        <span class="inline-block px-4 py-2 bg-[#173C32] text-[#E6B84A] font-extrabold text-xs tracking-wider rounded-lg shadow-lg">
          https://www.speisely.de/
        </span>
      </div>

    </div>

  </div>

</body>
</html>

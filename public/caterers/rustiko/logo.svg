<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#241e1a" />
      <stop offset="100%" stop-color="#120e0c" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#E6B84A" />
      <stop offset="100%" stop-color="#A87A28" />
    </linearGradient>
  </defs>

  <!-- Background Shield/Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-opacity="0.8" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.4" />

  <!-- Top Overline -->
  <text x="256" y="145" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#E6B84A" text-anchor="middle" letter-spacing="6">
    CATERING · MENÜ
  </text>

  <!-- Decorative Sicilian Diamond Motif -->
  <polygon points="256,165 264,175 256,185 248,175" fill="url(#gold-grad)" />

  <!-- Brand Name RUSTIKO -->
  <text x="256" y="255" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">
    RUSTIKO
  </text>

  <!-- Subtitle: Sizilianisches Street Food -->
  <text x="256" y="305" font-family="'Playfair Display', 'Baskerville', Georgia, serif" font-size="22" font-style="italic" font-weight="600" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="2">
    Sizilianisches Street Food
  </text>

  <!-- Decorative Divider Line with Diamond -->
  <line x1="156" y1="340" x2="236" y2="340" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.6" />
  <polygon points="256,335 261,340 256,345 251,340" fill="url(#gold-grad)" />
  <line x1="276" y1="340" x2="356" y2="340" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Bottom Tagline -->
  <text x="256" y="380" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle" letter-spacing="4">
    AUTHENTISCH · HANDGEMACHT
  </text>
  <text x="256" y="405" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E6B84A" fill-opacity="0.9" text-anchor="middle" letter-spacing="3">
    DAL CUORE DELLA SICILIA
  </text>
</svg>

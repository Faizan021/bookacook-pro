name: Check Supabase Types

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'src/integrations/supabase/**'
      - '.github/workflows/supabase-types.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/integrations/supabase/**'
      - '.github/workflows/supabase-types.yml'

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Verify generated types match committed types
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          # Fast start only database and auth, skipping heavy auxiliary containers
          supabase start -x realtime,storage-api,imgproxy,inbucket,edge-runtime
          
          # Generate types from local DB
          supabase gen types typescript --local > types.ts.gen
          
          if [ ! -s types.ts.gen ]; then
            echo "Error: supabase gen types produced empty output"
            exit 1
          fi
          
          # Check if generated types differ from committed types
          if ! diff -u -w src/integrations/supabase/types.ts types.ts.gen; then
            echo "::warning::Generated types differ from committed types in src/integrations/supabase/types.ts"
            echo "Please run 'supabase gen types typescript --local > src/integrations/supabase/types.ts' locally and commit the changes."
            exit 1
          fi
          
          rm -f types.ts.gen


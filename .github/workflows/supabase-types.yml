name: Check Supabase Types

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "src/integrations/supabase/**"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/integrations/supabase/**"

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify generated types match committed types
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          echo "Starting Supabase local instance..."
          if ! supabase start -x realtime,storage-api,imgproxy,inbucket,edge-runtime; then
            echo "::warning::supabase start could not boot local containers on runner. Skipping local type verification."
            exit 0
          fi

          # Generate types from local DB
          if ! supabase gen types typescript --local > types.ts.gen; then
            echo "::warning::supabase gen types failed. Skipping type diff check."
            exit 0
          fi

          if [ ! -s types.ts.gen ]; then
            echo "::warning::supabase gen types produced empty output."
            exit 0
          fi

          # Check if generated types differ from committed types
          if ! diff -u -w src/integrations/supabase/types.ts types.ts.gen; then
            echo "::warning::Generated types differ from committed types in src/integrations/supabase/types.ts"
            echo "Tip: Run 'supabase gen types typescript --local > src/integrations/supabase/types.ts' locally to sync."
          else
            echo "Supabase types are 100% in sync with migrations."
          fi

          rm -f types.ts.gen
